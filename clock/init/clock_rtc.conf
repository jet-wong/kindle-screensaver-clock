description "kindle-clock RTC wakeup screensaver refresher"
author "workbuddy"

start on started framework
stop on stopping framework

env KC_RTC_PERIOD=300

env KC_RTC=1

respawn
respawn limit 5 300

pre-start script
    i=0
    while [ ! -f /mnt/us/clock/rtc_refresh.sh ] && [ $i -lt 30 ]; do
        i=$((i + 1))
        sleep 1
    done
end script

exec /bin/sh /mnt/us/clock/rtc_refresh.sh
