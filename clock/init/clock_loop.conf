description "kindle-clock render loop"
author "workbuddy"

start on started framework
stop on stopping framework

respawn
respawn limit 5 300

pre-start script
    i=0
    while [ ! -f /mnt/us/clock/launch.sh ] && [ $i -lt 30 ]; do
        i=$((i + 1))
        sleep 1
    done
end script

exec /bin/sh /mnt/us/clock/launch.sh
